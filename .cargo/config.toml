[alias]
build-ps2-dev = "build -Z build-std=core,alloc -Z build-std-features=compiler-builtins-mem -Z json-target-spec --target mipsel-sony-ps2.json"
build-ps2-release = "build -Z build-std=core,alloc -Z build-std-features=compiler-builtins-mem -Z json-target-spec --target mipsel-sony-ps2.json --release"

[unstable]
# build-std = ["core", "compiler_builtins"]
# build-std-features = ["compiler-builtins-mem"]

[target.mipsel-sony-ps2]
linker = "mips64r5900el-ps2-elf-gcc"
rustflags = [
  "-C", "target-feature=+mips3,+soft-float",
  "-C", "relocation-model=static",
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,-s",
]
