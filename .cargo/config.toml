[alias]
build-ps2 = "build --target mips64el-sony-ps2.json -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem"
build-ps2-release = "build --target mips64el-sony-ps2.json --release -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem"
build-ps2-x32 = "build --target mipsel-sony-ps2.json -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem"

[unstable]
json-target-spec = true
script = true

[target.'cfg(target_vendor = "sony")']
linker = "mips64r5900el-ps2-elf-gcc"
runner = "just ps2-runner"
# runner = "./scripts/pcsx2-test-runner.rs"

rustflags = []
