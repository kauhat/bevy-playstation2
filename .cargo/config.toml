[alias]
build-ps2-dev = "build -Z build-std=core,alloc -Z build-std-features=compiler-builtins-mem -Z json-target-spec --target mips64el-sony-ps2.json"
build-ps2 = "build --target mips64el-sony-ps2.json --release -Z build-std=core,alloc -Z build-std-features=compiler-builtins-mem -Z json-target-spec"
run-ps2 = "run --target mips64el-sony-ps2.json --release -Z script -Z build-std=core,alloc -Z build-std-features=compiler-builtins-mem -Z json-target-spec"
test-ps2 = "test --target mips64el-sony-ps2.json --release -Z script -Z build-std=core,alloc -Z build-std-features=compiler-builtins-mem -Z json-target-spec"

[target.'cfg(target_arch = "mips64")']
linker = "mips64r5900el-ps2-elf-gcc"

runner = "cargo -Z script ./scripts/pcsx2-test-runner.rs"

rustflags = [
  # "-C", "target-feature=+mips3,+soft-float",
  # "-C", "relocation-model=static",
  # "-C", "link-arg=-Wl,--gc-sections",

  # Strip debug symbols
  # "-C", "link-arg=-Wl,-s",

  # Linker group & dependencies
  # "-C", "link-arg=-Wl,--start-group",
  # "-C", "link-arg=-lc",
  # "-C", "link-arg=-lcglue",
  # "-C", "link-arg=-lkernel",
  # "-C", "link-arg=-latomic",
  # "-C", "link-arg=-lpthreadglue",
  # "-C", "link-arg=-lpthread",
  # "-C", "link-arg=-ldebug",
  # "-C", "link-arg=-Wl,--end-group",
]
